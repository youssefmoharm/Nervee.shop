[project]
id = "gfmxvvjqlhrnmidutjwx"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[auth]
enabled = true
site_url = "https://www.nerveey.shop"
additional_redirect_urls = ["https://www.nerveey.shop"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "50MiB"

# Edge Function JWT verification configuration
# Default: all functions require JWT verification
# Individual functions can override in their own sections below

# Public functions (customer-facing, no JWT required)
[functions.back-in-stock]
verify_jwt = false

[functions.chat-ai]
verify_jwt = false

[functions.contact]
verify_jwt = false

[functions.create-order]
verify_jwt = false

[functions.create-support-ticket]
verify_jwt = false

[functions.handle-unsubscribe]
verify_jwt = false

[functions.payment-webhook]
verify_jwt = false

[functions.verify-guest-order]
verify_jwt = false

[functions.request-return]
verify_jwt = false

# Admin/service functions (JWT required, admin check in code)
[functions.create-payment]
verify_jwt = true

[functions.process-abandoned-carts]
verify_jwt = false

[functions.process-restock]
verify_jwt = true

[functions.send-back-in-stock]
verify_jwt = true

[functions.send-email]
verify_jwt = true

[functions.update-order-status]
verify_jwt = true

[functions.security-test]
verify_jwt = true
