name: CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Mapped at job level so step `if:` guards can read them (empty when the
      # secret is not configured — the Sentry upload step then skips).
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        id: playwright-install
        run: npx playwright install --with-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run unit tests (Vitest)
        run: npm run test -- --run --coverage

      - name: Upload Vitest coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage
          retention-days: 7
          if-no-files-found: ignore

      - name: Compile frontend (full sitemap build runs with isolated Supabase below)
        run: npm exec -- tsc -b && npm exec -- vite build

      - name: Set APP_VERSION
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      # Only runs when SENTRY_AUTH_TOKEN is configured — skipped otherwise.
      - name: Upload Sentry source maps
        if: env.SENTRY_AUTH_TOKEN != ''
        run: npx @sentry/cli@2 sourcemaps upload --release "@nerve@${APP_VERSION}" dist

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Use Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno check edge functions
        run: deno check supabase/functions/**/*.ts

      - name: Run Deno tests
        run: npm run test:deno

      # Local dev-server E2E only — @live specs are excluded by default
      # (grepInvert in playwright.config.ts) and run via live-smoke.yml.
      - name: Run Playwright E2E
        if: ${{ !cancelled() && steps.playwright-install.outcome == 'success' }}
        env:
          CI: true
        run: npm run test:e2e
        timeout-minutes: 10

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: warn

  # Advisory Lighthouse budgets (performance ≥ 0.7, accessibility ≥ 0.9).
  # continue-on-error: a red LHCI run never blocks the PR. LHCI_GITHUB_APP_TOKEN
  # is optional — without it, lhci skips posting status checks and only asserts.
  lighthouse:
    name: Lighthouse CI (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing GitHub secrets VITE_SUPABASE_URL and/or VITE_SUPABASE_ANON_KEY."
            exit 1
          fi
          npm run build

      - name: Verify SEO artifacts (sitemap + robots)
        run: node scripts/verify-seo.mjs

      - name: Run Lighthouse CI
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        # Pinned + ephemeral: @lhci/cli was removed from package.json so the
        # vulnerable tmp/uuid/puppeteer dev chain stays out of the lockfile
        # (audit SEC-11). Same version the budgets were tuned against.
        run: npx --yes @lhci/cli@0.14.0 autorun

  database:
    name: Required database integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        with:
          version: 2.39.2
      - name: Install dependencies
        run: npm ci
      - name: Start isolated Supabase and apply every migration
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
      - name: Install SQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Execute database assertions (never skip)
        run: |
          npm run test:sql
          node scripts/test-checkout-concurrency.mjs
        env:
          REQUIRE_SQL_TESTS: '1'
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Verify backup restoration into separate database
        run: node scripts/verify-local-restore.mjs
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Export disposable local connection settings
        run: |
          umask 077
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
      - name: Build with real local catalog and verify sitemap
        run: |
          node --env-file="$RUNNER_TEMP/supabase.env" scripts/build-local.mjs
          npm run verify:seo
      - name: Start local edge functions
        run: |
          supabase functions serve > "$RUNNER_TEMP/edge-functions.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/edge-functions.pid"
          for attempt in $(seq 1 60); do
            if curl -s -o /dev/null -f http://127.0.0.1:54321/functions/v1/; then exit 0; fi
            # A 404 from the running router also establishes HTTP readiness.
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:54321/functions/v1/verify-guest-order)" = '405' ]; then exit 0; fi
            sleep 2
          done
          echo 'Edge functions did not become ready'; exit 1
      - name: Exercise guest and account checkout against local edge functions
        run: node --env-file="$RUNNER_TEMP/supabase.env" scripts/test-local-backend.mjs
      - name: Stop isolated services
        if: always()
        run: supabase stop --no-backup
