name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Mapped at job level so step `if:` guards can read them (empty when the
      # secret is not configured — the Sentry upload step then skips).
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        id: playwright-install
        run: npx playwright install --with-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run unit tests (Vitest)
        run: npm run test -- --run --coverage

      - name: Upload Vitest coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage
          retention-days: 7
          if-no-files-found: ignore

      - name: Build
        env:
          # Public VITE_* values required by prebuild sitemap. Configure as
          # GitHub Actions secrets — never commit credential values here.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Emit hidden source maps so the Sentry upload step below can
          # symbolicate releases. This CI dist is never deployed (Vercel
          # runs its own build without this flag, so no .map files ship).
          SENTRY_UPLOAD: '1'
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing GitHub secrets VITE_SUPABASE_URL and/or VITE_SUPABASE_ANON_KEY. Set them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          npm run build

      # prebuild generates public/sitemap.xml; this gate fails the build if the
      # sitemap or robots.txt is missing/empty or missing required directives.
      - name: Verify SEO artifacts (sitemap + robots)
        run: node scripts/verify-seo.mjs

      - name: Set APP_VERSION
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      # Only runs when SENTRY_AUTH_TOKEN is configured — skipped otherwise.
      - name: Upload Sentry source maps
        if: env.SENTRY_AUTH_TOKEN != ''
        run: npx @sentry/cli@2 sourcemaps upload --release "@nerve@${APP_VERSION}" dist

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Use Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno check edge functions
        run: deno check supabase/functions/**/*.ts

      - name: Run Deno tests
        run: npm run test:deno

      - name: Run SQL tests (optional)
        run: npm run test:sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Local dev-server E2E only — @live specs are excluded by default
      # (grepInvert in playwright.config.ts) and run via live-smoke.yml.
      - name: Run Playwright E2E
        if: ${{ !cancelled() && steps.playwright-install.outcome == 'success' }}
        env:
          CI: true
        run: npm run test:e2e
        timeout-minutes: 10

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: warn

  # Advisory Lighthouse budgets (performance ≥ 0.7, accessibility ≥ 0.9).
  # continue-on-error: a red LHCI run never blocks the PR. LHCI_GITHUB_APP_TOKEN
  # is optional — without it, lhci skips posting status checks and only asserts.
  lighthouse:
    name: Lighthouse CI (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing GitHub secrets VITE_SUPABASE_URL and/or VITE_SUPABASE_ANON_KEY."
            exit 1
          fi
          npm run build

      - name: Verify SEO artifacts (sitemap + robots)
        run: node scripts/verify-seo.mjs

      - name: Run Lighthouse CI
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        # Pinned + ephemeral: @lhci/cli was removed from package.json so the
        # vulnerable tmp/uuid/puppeteer dev chain stays out of the lockfile
        # (audit SEC-11). Same version the budgets were tuned against.
        run: npx --yes @lhci/cli@0.14.0 autorun
