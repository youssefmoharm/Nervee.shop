name: Preview gate

# Playwright smoke against a Vercel preview deployment. Skips cleanly when
# PREVIEW_URL is not configured (repo variable preferred, secret as fallback).
# Chromium only; @live specs are excluded so this never touches production.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_URL: ${{ vars.PREVIEW_URL || secrets.PREVIEW_URL }}
    steps:
      - name: Check PREVIEW_URL is configured
        id: check
        run: |
          if [ -z "$PREVIEW_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PREVIEW_URL not set (repo variable or secret) — skipping preview Playwright gate."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Running preview gate against $PREVIEW_URL"
          fi

      - uses: actions/checkout@v7
        if: steps.check.outputs.configured == 'true'

      - name: Use Node.js 24
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        run: npm ci

      - name: Install Playwright chromium
        if: steps.check.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright against preview URL
        if: steps.check.outputs.configured == 'true'
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ env.PREVIEW_URL }}
        run: npx playwright test --config scripts/playwright.preview.config.ts --project=chromium --grep-invert @live
        timeout-minutes: 15

      - name: Upload Playwright Report
        if: ${{ always() && steps.check.outputs.configured == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: warn
