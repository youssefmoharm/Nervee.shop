name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

# NOTE: This deploys via a VERCEL REMOTE BUILD, which only reads environment
# variables configured in the Vercel project dashboard (Settings -> Environment
# Variables -> Production). Without those, the frontend falls back to mock data
# ("Checkout requires Supabase to be configured").
#
# Set BOTH of these as Production env vars in the Vercel dashboard:
#   VITE_SUPABASE_URL     = https://gfmxvvjqlhrnmidutjwx.supabase.co
#   VITE_SUPABASE_ANON_KEY = sb_publishable_6zkBS2alnvDPd0pSqVJBkQ_76y60UBW