name: Deploy to Vercel

# Deploy only after CI has passed — never push to production on a red build.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Never cancel a production deploy mid-flight; one deploy per head branch at a time.
concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy if the triggering CI run succeeded — manual dispatch removed to prevent bypass.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # Extra guard: require Vercel secrets to be set.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the exact commit CI validated (workflow_run checks out
          # the default branch HEAD otherwise, which may have moved on).
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify Vercel secrets are configured
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Missing Vercel secrets (VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID). Configure them in GitHub → Settings → Secrets."
            exit 1
          fi

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
# NOTE: Vercel's REMOTE BUILD reads env vars from the Vercel project
# dashboard (Settings → Environment Variables → Production). Required vars:
#   VITE_SUPABASE_URL       = https://YOUR_PROJECT_REF.supabase.co
#   VITE_SUPABASE_ANON_KEY  = your_supabase_anon_key_here
# These must be configured manually in Vercel before deploying — Vercel does
# not read them from this repository or from .env files.
