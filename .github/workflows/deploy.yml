name: Deploy to Vercel

# Deploy only after CI has passed — never push to production on a red build.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy if the triggering CI run succeeded (or manual dispatch).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # Extra guard: require Vercel secrets to be set.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify Vercel secrets are configured
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Missing Vercel secrets (VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID). Configure them in GitHub → Settings → Secrets."
            exit 1
          fi

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

# NOTE: Vercel's REMOTE BUILD only reads env vars from the Vercel project
# dashboard (Settings → Environment Variables → Production). Required vars:
#   VITE_SUPABASE_URL       = https://gfmxvvjqlhrnmidutjwx.supabase.co
#   VITE_SUPABASE_ANON_KEY  = sb_publishable_6zkBS2alnvDPd0pSqVJBkQ_76y60UBW
# The production build will intentionally FAIL if these are missing
# (see src/lib/supabase.ts) — no silent mock fallback in production.
