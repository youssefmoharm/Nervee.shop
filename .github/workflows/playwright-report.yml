name: Playwright Report

on:
  workflow_run:
    workflows: [CI]
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  upload-report:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check for playwright-report artifact on triggering run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS_URL: ${{ github.event.workflow_run.artifacts_url }}
        run: |
          count=$(gh api "$ARTIFACTS_URL" \
            --jq '[.artifacts[] | select(.name == "playwright-report" and (.expired == false))] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" = "0" ]; then
            echo "::notice::No playwright-report artifact on triggering CI run (nothing to download)."
          fi

      - name: Download playwright report artifact
        if: steps.check.outputs.count != '0'
        uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: ./playwright-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Re-upload playwright report
        if: steps.check.outputs.count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: warn
